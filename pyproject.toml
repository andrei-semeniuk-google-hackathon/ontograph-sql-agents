[project]
name = "ontoagents"
version = "0.1.0"
description = "Ontology-grounded multi-agent Text-to-SQL on LangGraph: a knowledge graph decides what a question means, an SQL agent answers it, a validator decides whether the answer can be trusted."
readme = "README.md"
authors = [{ name = "Andrei Semeniuk", email = "semeniukandrei@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langgraph>=1.2.16",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "sqlglot>=30.24.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ontoagents = "ontoagents.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "rdflib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs Docker (Postgres via Testcontainers)",
    "llm: calls a real model, needs ANTHROPIC_API_KEY",
]
